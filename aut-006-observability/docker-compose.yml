services:
  app:
    build: ./app
    ports:
      - "5001:5000"
    environment:
      PYTHONUNBUFFERED: "1"
      DUMMY_API_KEY: ${DUMMY_API_KEY}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
