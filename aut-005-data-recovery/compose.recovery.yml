services:
  recovery-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recovery_db
      POSTGRES_USER: recovery_user
      POSTGRES_PASSWORD: recovery_test_only
    volumes:
      - recoverydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery_user -d recovery_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  recoverydata:
